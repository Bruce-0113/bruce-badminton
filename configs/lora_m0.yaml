# mlx_lm.lora -c configs/lora_m0.yaml
model: mlx-community/Qwen3.5-4B-bf16
train: true
fine_tune_type: lora
data: data/m0              # train.jsonl / valid.jsonl（chat messages 格式）
mask_prompt: true          # 只對教練回答算 loss
num_layers: 16             # 最後 16 層加 LoRA
batch_size: 2
grad_accumulation_steps: 4 # 等效 batch 8
iters: 600                 # 約 1500 筆 × 3 epoch ÷ 8；資料量變了要跟著調
learning_rate: 1e-5
max_seq_length: 2048
grad_checkpoint: true      # 省記憶體，24GB 夠用
steps_per_eval: 100
save_every: 100
adapter_path: out/adapters-m0
lora_parameters:
  rank: 16
  scale: 20.0
  dropout: 0.05
